name: Bootstrap Staging Application

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA verified and approved for release'
        required: true
        type: string
      release_id:
        description: 'Release identifier label (e.g. sp-8b-staging-release-01)'
        required: true
        type: string
      release_run_id:
        description: 'Workflow run ID of the release image publication run (e.g. 33556885396)'
        required: true
        type: string
      manifest_sha256:
        description: 'Exact SHA-256 checksum of the release manifest artifact'
        required: true
        type: string
      authorization_reference:
        description: 'Executive written authorization identifier (e.g. AUTH-VERNON-20260902-BOOTSTRAP)'
        required: true
        type: string
      confirm_bootstrap:
        description: 'I confirm authorization to execute the initial staging application bootstrap'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: socialpulse-staging-mutation
  cancel-in-progress: false

jobs:
  bootstrap-app:
    name: Bootstrap Staging Application (server & client)
    runs-on: [self-hosted, linux, socialpulse-staging]
    environment: staging

    steps:
      - name: Validate Inputs, Allowlist & Fail-Closed Guards
        env:
          INPUT_CONFIRM_BOOTSTRAP: ${{ inputs.confirm_bootstrap }}
          INPUT_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          echo "=== VALIDATING INITIAL BOOTSTRAP INPUTS & AUTHORIZATION ==="

          if [ "$INPUT_CONFIRM_BOOTSTRAP" != "true" ]; then
            echo "ERROR: Application bootstrap not confirmed. Aborting."
            exit 1
          fi

          if ! [[ "$INPUT_AUTHORIZATION_REFERENCE" =~ ^[a-zA-Z0-9._\ -]{1,128}$ ]]; then
            echo "ERROR: Invalid authorization reference format."
            exit 1
          fi

          if ! [[ "$INPUT_RELEASE_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]; then
            echo "ERROR: Invalid release ID format."
            exit 1
          fi

          if ! [[ "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA format."
            exit 1
          fi

          if ! [[ "$INPUT_RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid release run ID format."
            exit 1
          fi

          if ! [[ "$INPUT_MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Manifest SHA-256 must be exactly 64 hexadecimal characters."
            exit 1
          fi

          echo "Bootstrap authorization verified for release '$INPUT_RELEASE_ID' on staging."

      - name: Preflight Host Tool, Docker Version, Staging Environment File Identity & Container State
        run: |
          set -euo pipefail
          echo "=== PREFLIGHT TOOL AVAILABILITY CHECK ==="
          for tool in gh node sha256sum git docker wget realpath mktemp chmod stat; do
            if ! command -v "$tool" &>/dev/null; then
              echo "ERROR: Required tool '$tool' is not available on runner. Aborting."
              exit 1
            fi
          done

          echo "=== DOCKER COMPOSE VERSION VERIFICATION (>= 2.24.4) ==="
          COMPOSE_VER_RAW=$(docker compose version --short 2>/dev/null || docker compose version 2>/dev/null || true)
          node -e "
            const raw = process.argv[1] || '';
            const match = raw.match(/([0-9]+)\.([0-9]+)\.([0-9]+)/);
            if (!match) {
              console.error('ERROR: Unable to determine machine-readable Docker Compose version:', raw);
              process.exit(1);
            }
            const [_, major, minor, patch] = match.map(Number);
            const isAtLeast = (major > 2) ||
                              (major === 2 && minor > 24) ||
                              (major === 2 && minor === 24 && patch >= 4);
            if (!isAtLeast) {
              console.error('ERROR: Docker Compose version 2.24.4 or later is strictly required for !override semantics (found: ' + raw + ').');
              process.exit(1);
            }
            console.log('Docker Compose version verified: ' + raw + ' (>= 2.24.4)');
          " "$COMPOSE_VER_RAW"

          echo "=== STAGING ENVIRONMENT CONFIGURATION & DIRECTORY PREFLIGHT ==="
          STAGING_DIR="/opt/socialpulse"
          STAGING_ENV_FILE="/opt/socialpulse/.env"

          if [ ! -d "$STAGING_DIR" ] || [ -L "$STAGING_DIR" ]; then
            echo "ERROR: Staging directory '$STAGING_DIR' must exist as a regular non-symlink directory."
            exit 1
          fi

          if [ ! -f "$STAGING_ENV_FILE" ] || [ -L "$STAGING_ENV_FILE" ]; then
            echo "ERROR: Staging environment file '$STAGING_ENV_FILE' must exist as a regular non-symlink file."
            exit 1
          fi

          # 1. Canonical path isolation check
          CANONICAL_DIR=$(realpath "$STAGING_DIR")
          CANONICAL_ENV_FILE=$(realpath "$STAGING_ENV_FILE")

          if [ -n "${GITHUB_WORKSPACE:-}" ] && ([[ "$CANONICAL_ENV_FILE" == "${GITHUB_WORKSPACE}"* ]] || [[ "$CANONICAL_DIR" == "${GITHUB_WORKSPACE}"* ]]); then
            echo "ERROR: Staging environment file or directory cannot reside inside checkout workspace."
            exit 1
          fi

          if [ -n "${RUNNER_TEMP:-}" ] && ([[ "$CANONICAL_ENV_FILE" == "${RUNNER_TEMP}"* ]] || [[ "$CANONICAL_DIR" == "${RUNNER_TEMP}"* ]]); then
            echo "ERROR: Staging environment file or directory cannot reside inside runner temporary directory."
            exit 1
          fi

          # 2. Strict symbolic owner verification (must be exact string root)
          ENV_OWNER=$(stat -c '%U' "$STAGING_ENV_FILE")
          if [ "$ENV_OWNER" != "root" ]; then
            echo "ERROR: Staging environment file owner must be exact symbolic 'root' (got: $ENV_OWNER)."
            exit 1
          fi

          # 3. Strict symbolic group verification (must be exact string github-runner)
          ENV_GROUP=$(stat -c '%G' "$STAGING_ENV_FILE")
          if [ "$ENV_GROUP" != "github-runner" ]; then
            echo "ERROR: Staging environment file group must be exact symbolic 'github-runner' (got: $ENV_GROUP)."
            exit 1
          fi

          # 4. Strict permission mode verification (must be exactly 0640 / 640)
          ENV_MODE=$(stat -c '%a' "$STAGING_ENV_FILE")
          if [ "$ENV_MODE" != "640" ] && [ "$ENV_MODE" != "0640" ]; then
            echo "ERROR: Staging environment file mode must be 0640 (got: $ENV_MODE)."
            exit 1
          fi

          # 5. Readability verification
          if [ ! -r "$STAGING_ENV_FILE" ]; then
            echo "ERROR: Staging environment file '$STAGING_ENV_FILE' is not readable by runner identity."
            exit 1
          fi
          echo "Staging environment configuration file verified (Owner: root, Group: github-runner, Mode: 0640)."

          echo "=== PARSING & VALIDATING STAGING ENVIRONMENT (NON-SOURCING, NO SECRET LEAKAGE) ==="
          node -e "
            const fs = require('fs');
            const envFile = process.argv[1];
            const requiredVars = process.argv[2].split(',').filter(Boolean);
            const requireProduction = process.argv[3] === 'true';

            const lines = fs.readFileSync(envFile, 'utf8').split(/\r?\n/);
            const parsed = new Map();

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line || line.startsWith('#')) continue;
              const eqIdx = line.indexOf('=');
              if (eqIdx <= 0) {
                console.error('ERROR: Malformed environment line ' + (i + 1) + ' in ' + envFile);
                process.exit(1);
              }
              const key = line.slice(0, eqIdx).trim();
              let val = line.slice(eqIdx + 1).trim();

              if (parsed.has(key)) {
                console.error('ERROR: Duplicate active environment variable assignment rejected: ' + key);
                process.exit(1);
              }

              if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.slice(1, -1);
              }

              if (val.trim().length === 0) {
                console.error('ERROR: Empty or whitespace-only assignment for required variable: ' + key);
                process.exit(1);
              }

              parsed.set(key, val);
            }

            for (const req of requiredVars) {
              if (!parsed.has(req)) {
                console.error('ERROR: Required environment variable missing: ' + req);
                process.exit(1);
              }
            }

            if (requireProduction) {
              const nodeEnv = parsed.get('NODE_ENV');
              if (nodeEnv !== 'production') {
                console.error('ERROR: Staging NODE_ENV must be strictly "production" (got: ' + nodeEnv + ')');
                process.exit(1);
              }
            }

            console.log('Environment configuration safely validated (' + parsed.size + ' variables checked, zero secrets leaked).');
          " "$STAGING_ENV_FILE" "POSTGRES_PASSWORD,REDIS_PASSWORD,NODE_ENV,JWT_SECRET,ACTIVE_ENCRYPTION_KEY_ID,ENCRYPTION_KEYS_JSON,FRONTEND_URL,BACKEND_URL,APP_URL" "true"

          echo "=== VERIFYING NO APPLICATION CONTAINERS ARE ALREADY RUNNING ==="
          EXISTING_BACKEND=$(docker inspect --format='{{.Config.Image}}' socialpulse-staging-server-1 2>/dev/null || true)
          EXISTING_FRONTEND=$(docker inspect --format='{{.Config.Image}}' socialpulse-staging-client-1 2>/dev/null || true)

          if [ -n "$EXISTING_BACKEND" ] || [ -n "$EXISTING_FRONTEND" ]; then
            echo "ERROR: Application containers (backend/frontend) are already present on host for project 'socialpulse-staging'. An initial bootstrap is not allowed when containers exist."
            exit 1
          fi

          echo "Bootstrap preflight completed successfully."

      - name: Authenticate Protected-Main Release Workflow Run & Artifact Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          echo "=== AUTHENTICATING RELEASE RUN & ARTIFACT METADATA (PRIOR TO CHECKOUT) ==="

          RUN_JSON=$(gh api "/repos/ArtradePro/Socialpulse-1/actions/runs/$INPUT_RELEASE_RUN_ID")
          node -e "
            const run = JSON.parse(process.argv[1]);
            if (!run || !run.repository || run.repository.full_name !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Run repository mismatch:', run?.repository?.full_name);
              process.exit(1);
            }
            if (!run.head_repository || run.head_repository.full_name !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Forked or unauthorized head repository:', run?.head_repository?.full_name);
              process.exit(1);
            }
            if (run.path !== '.github/workflows/release-images.yml') {
              console.error('ERROR: Run is not exact .github/workflows/release-images.yml:', run.path);
              process.exit(1);
            }
            if (run.name !== 'Release Images') {
              console.error('ERROR: Run name mismatch:', run.name);
              process.exit(1);
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              console.error('ERROR: Release run did not complete successfully:', run.status, run.conclusion);
              process.exit(1);
            }
            if (run.event !== 'workflow_dispatch') {
              console.error('ERROR: Release run was not triggered via manual workflow_dispatch:', run.event);
              process.exit(1);
            }
            if (run.head_branch !== 'main') {
              console.error('ERROR: Release run did not originate from protected main branch:', run.head_branch);
              process.exit(1);
            }
            if (run.head_sha !== process.env.INPUT_COMMIT_SHA) {
              console.error('ERROR: Release run head SHA mismatch:', run.head_sha);
              process.exit(1);
            }
            console.log('Protected-main release run metadata authenticated successfully.');
          " "$RUN_JSON"

          ARTIFACTS_JSON=$(gh api "/repos/ArtradePro/Socialpulse-1/actions/runs/$INPUT_RELEASE_RUN_ID/artifacts")
          node -e "
            const data = JSON.parse(process.argv[1]);
            const targetName = 'release-manifest-' + process.env.INPUT_RELEASE_ID;
            const matched = (data.artifacts || []).filter(a => a.name === targetName);
            if (matched.length !== 1) {
              console.error('ERROR: Expected exactly 1 artifact named', targetName, 'found:', matched.length);
              process.exit(1);
            }
            if (matched[0].expired) {
              console.error('ERROR: Manifest artifact is expired.');
              process.exit(1);
            }
            console.log('Manifest artifact authenticated and unexpired.');
          " "$ARTIFACTS_JSON"

      - name: Checkout Authorized Release Configuration Provenance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          clean: true

      - name: Verify Configuration & Git Provenance
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "$INPUT_COMMIT_SHA" ]; then
            echo "ERROR: Checked out HEAD ($CURRENT_HEAD) does not match authorized commit ($INPUT_COMMIT_SHA)."
            exit 1
          fi
          echo "Configuration provenance verified at commit $CURRENT_HEAD."

      - name: Validate Effective Staging Compose Configuration (Suppressed Output)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env config --quiet
          echo "Effective Staging Compose configuration is valid."

      - name: Create Dedicated Secure Temporary Directory & Cryptographically Verify Release Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          echo "=== VALIDATING DEDICATED RUNNER TEMP & CREATING SECURE TEMPORARY DIRECTORY ==="

          if [ -z "${RUNNER_TEMP:-}" ] || [ ! -d "$RUNNER_TEMP" ] || [ -L "$RUNNER_TEMP" ] || [ ! -w "$RUNNER_TEMP" ]; then
            echo "ERROR: RUNNER_TEMP must be a defined, existing, non-symlink, writable directory."
            exit 1
          fi

          CANONICAL_RUNNER_TEMP=$(realpath "$RUNNER_TEMP")
          if [ "$CANONICAL_RUNNER_TEMP" = "/" ] || \
             [ "$CANONICAL_RUNNER_TEMP" = "$HOME" ] || \
             [ "$CANONICAL_RUNNER_TEMP" = "/tmp" ] || \
             [ "$CANONICAL_RUNNER_TEMP" = "/opt" ] || \
             [ "$CANONICAL_RUNNER_TEMP" = "${GITHUB_WORKSPACE:-}" ]; then
            echo "ERROR: RUNNER_TEMP ($CANONICAL_RUNNER_TEMP) cannot be root, home, /tmp, /opt, or workspace root."
            exit 1
          fi

          SECURE_DIR=$(mktemp -d "$CANONICAL_RUNNER_TEMP/sp-manifest.XXXXXX")
          chmod 700 "$SECURE_DIR"
          CANONICAL_SECURE_DIR=$(realpath "$SECURE_DIR")

          if [[ "$CANONICAL_SECURE_DIR" != "$CANONICAL_RUNNER_TEMP/"* ]] || [ -L "$SECURE_DIR" ]; then
            echo "ERROR: Unsafe temporary directory path: $SECURE_DIR"
            exit 1
          fi

          echo "MANIFEST_TMP_DIR=$CANONICAL_SECURE_DIR" >> "$GITHUB_ENV"

          gh run download "$INPUT_RELEASE_RUN_ID" --name "release-manifest-$INPUT_RELEASE_ID" --dir "$CANONICAL_SECURE_DIR"

          MANIFEST_FILE="$CANONICAL_SECURE_DIR/release-manifest.json"
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Release manifest file not found in artifact."
            exit 1
          fi

          COMPUTED_SHA256=$(sha256sum "$MANIFEST_FILE" | awk '{print $1}')
          echo "Computed Manifest SHA-256: $COMPUTED_SHA256"
          echo "Expected Manifest SHA-256: $INPUT_MANIFEST_SHA256"

          if [ "$COMPUTED_SHA256" != "$INPUT_MANIFEST_SHA256" ]; then
            echo "ERROR: Manifest SHA-256 checksum mismatch! Aborting."
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));

            if (m.schemaVersion !== '1.0.0') {
              console.error('ERROR: Invalid manifest schemaVersion:', m.schemaVersion);
              process.exit(1);
            }
            if (m.repository !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Manifest repository mismatch:', m.repository);
              process.exit(1);
            }
            if (m.releaseId !== process.env.INPUT_RELEASE_ID) {
              console.error('ERROR: Manifest releaseId mismatch:', m.releaseId);
              process.exit(1);
            }
            if (m.targetEnvironment !== 'staging') {
              console.error('ERROR: Manifest targetEnvironment mismatch (expected staging):', m.targetEnvironment);
              process.exit(1);
            }
            if (m.sourceCommit !== process.env.INPUT_COMMIT_SHA) {
              console.error('ERROR: Manifest sourceCommit mismatch:', m.sourceCommit);
              process.exit(1);
            }
            if (String(m.workflowRunId) !== process.env.INPUT_RELEASE_RUN_ID) {
              console.error('ERROR: Manifest workflowRunId mismatch:', m.workflowRunId);
              process.exit(1);
            }
            if (!m.backend || m.backend.repository !== 'artradepro/socialpulse-backend') {
              console.error('ERROR: Manifest backend repository mismatch:', m?.backend?.repository);
              process.exit(1);
            }
            if (m.backend.tag !== 'sha-' + process.env.INPUT_COMMIT_SHA) {
              console.error('ERROR: Manifest backend tag mismatch:', m?.backend?.tag);
              process.exit(1);
            }
            if (!/^sha256:[0-9a-fA-F]{64}$/.test(m.backend.digest)) {
              console.error('ERROR: Invalid manifest backend digest:', m?.backend?.digest);
              process.exit(1);
            }
            if (!m.frontend || m.frontend.repository !== 'artradepro/socialpulse-frontend') {
              console.error('ERROR: Manifest frontend repository mismatch:', m?.frontend?.repository);
              process.exit(1);
            }
            if (m.frontend.tag !== 'sha-' + process.env.INPUT_COMMIT_SHA) {
              console.error('ERROR: Manifest frontend tag mismatch:', m?.frontend?.tag);
              process.exit(1);
            }
            if (!/^sha256:[0-9a-fA-F]{64}$/.test(m.frontend.digest)) {
              console.error('ERROR: Invalid manifest frontend digest:', m?.frontend?.digest);
              process.exit(1);
            }

            const backendRef = m.backend.repository + '@' + m.backend.digest;
            const frontendRef = m.frontend.repository + '@' + m.frontend.digest;

            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_BACKEND_REF=' + backendRef + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_FRONTEND_REF=' + frontendRef + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_BACKEND_DIGEST=' + m.backend.digest + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_FRONTEND_DIGEST=' + m.frontend.digest + '\n');
            console.log('Manifest identity fields fully verified against SP-8B schema. Image refs derived directly from manifest.');
          " "$MANIFEST_FILE"

          echo "=== RELEASE MANIFEST CRYPTOGRAPHICALLY BOUND & VERIFIED ==="

      - name: Pull Verified Release Images & Execute Initial Application Bootstrap
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          set -E

          echo "=== INITIATING CONTROLLED STAGING APPLICATION BOOTSTRAP ==="
          echo "Release ID: $INPUT_RELEASE_ID"
          echo "Authorization: $INPUT_AUTHORIZATION_REFERENCE"
          echo "Commit SHA: $INPUT_COMMIT_SHA"

          if [ -z "${DEPLOY_BACKEND_REF:-}" ] || [ -z "${DEPLOY_FRONTEND_REF:-}" ]; then
            echo "ERROR: Deployment image references are missing from environment."
            exit 1
          fi

          if ! [[ "$DEPLOY_BACKEND_REF" =~ ^artradepro/socialpulse-backend@sha256:[0-9a-fA-F]{64}$ ]] || \
             ! [[ "$DEPLOY_FRONTEND_REF" =~ ^artradepro/socialpulse-frontend@sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Deployment image references do not match exact immutable fixed-repository digest format."
            exit 1
          fi

          # 1. Pull verified immutable digests locally
          echo "Pulling verified immutable digests derived from manifest..."
          docker pull "$DEPLOY_BACKEND_REF"
          docker pull "$DEPLOY_FRONTEND_REF"

          # 2. Verify infrastructure dependency health (postgres and redis)
          echo "Verifying infrastructure dependency containers are healthy..."
          PG_STATUS=$(docker inspect --format='{{.State.Health.Status}}' socialpulse-staging-postgres-1 2>/dev/null || echo "unhealthy")
          REDIS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' socialpulse-staging-redis-1 2>/dev/null || echo "unhealthy")

          if [ "$PG_STATUS" != "healthy" ] || [ "$REDIS_STATUS" != "healthy" ]; then
            echo "ERROR: Infrastructure containers must be healthy before application bootstrap. Postgres: $PG_STATUS, Redis: $REDIS_STATUS."
            exit 1
          fi

          # 3. Verify database migration status is fully up to date (--require-current) before starting application services
          echo "Verifying database migration status before application bootstrap..."
          docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env run --rm --no-deps migrate npx ts-node src/database/scripts/migrationStatus.ts --require-current

          # Define fail-safe bootstrap cleanup handler (removes failed application containers while preserving database and redis)
          cleanup_failed_bootstrap() {
            trap '' ERR INT TERM
            set +e
            echo "=== INITIATING CLEANUP OF FAILED APPLICATION BOOTSTRAP ==="
            echo "Stopping and removing failed server and client containers (preserving postgres & redis volumes)..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env stop server client || true
            docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env rm -f server client || true
            echo "Failed application containers removed safely. Infrastructure state preserved."
            exit 1
          }

          trap cleanup_failed_bootstrap ERR INT TERM

          export SOCIALPULSE_BACKEND_IMAGE="$DEPLOY_BACKEND_REF"
          export SOCIALPULSE_FRONTEND_IMAGE="$DEPLOY_FRONTEND_REF"

          # 4. Initial start of application services with explicit immutable digests, env file and --no-deps
          echo "Starting application containers with verified release (--no-deps)..."
          docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env up -d --no-build --no-deps server client

          # 5. Bounded post-bootstrap readiness validation on loopback
          echo "Running bounded post-bootstrap readiness validation on http://127.0.0.1:5000/health/ready..."
          READY=0
          for attempt in {1..6}; do
            echo "Readiness probe attempt $attempt of 6..."
            RESPONSE=$(wget -qO- --timeout=5 http://127.0.0.1:5000/health/ready 2>/dev/null || true)
            if [ -n "$RESPONSE" ]; then
              if node -e "
                try {
                  const data = JSON.parse(process.argv[1]);
                  if (data.ready === true) process.exit(0);
                } catch(e) {}
                process.exit(1);
              " "$RESPONSE" 2>/dev/null; then
                echo "Readiness probe passed (ready: true)."
                READY=1
                break
              fi
            fi
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Application failed readiness validation on http://127.0.0.1:5000/health/ready after 30 seconds."
            cleanup_failed_bootstrap
          fi

          trap - ERR INT TERM
          echo "=== STAGING APPLICATION BOOTSTRAP COMPLETED SUCCESSFULLY ==="

      - name: Secure Temporary Artifact Cleanup
        if: always()
        run: |
          echo "=== RUNNING POST-BOOTSTRAP SECURE CLEANUP ==="
          if [ -n "${MANIFEST_TMP_DIR:-}" ] && [ -d "$MANIFEST_TMP_DIR" ]; then
            CANONICAL_TEMP_DIR=$(realpath "$MANIFEST_TMP_DIR" 2>/dev/null || true)
            if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
              CANONICAL_ROOT=$(realpath "$RUNNER_TEMP" 2>/dev/null || true)
              if [[ "$CANONICAL_TEMP_DIR" == "$CANONICAL_ROOT/"* ]] && \
                 [ "$CANONICAL_TEMP_DIR" != "/" ] && \
                 [ "$CANONICAL_TEMP_DIR" != "$HOME" ] && \
                 [ "$CANONICAL_TEMP_DIR" != "/tmp" ] && \
                 [ "$CANONICAL_TEMP_DIR" != "/opt" ]; then
                rm -rf "$CANONICAL_TEMP_DIR"
                echo "Generated temporary manifest directory safely cleaned: $CANONICAL_TEMP_DIR"
              fi
            fi
          fi

      - name: Output Application Bootstrap Audit Summary
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DEPLOY_BACKEND_DIGEST: ${{ env.DEPLOY_BACKEND_DIGEST }}
          DEPLOY_FRONTEND_DIGEST: ${{ env.DEPLOY_FRONTEND_DIGEST }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          echo "=== APPLICATION BOOTSTRAP AUDIT SUMMARY ==="
          echo "Environment: staging"
