name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: socialpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-characters-long
      JWT_EXPIRES_IN: 7d
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/socialpulse_test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/socialpulse_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STRIPE_SECRET_KEY: sk_test_dummy_ci_key_for_module_load
      STRIPE_WEBHOOK_SECRET: whsec_dummy_ci_webhook_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socialPulse-app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: socialPulse-app/backend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: socialPulse-app/backend

      - name: Run test suite with open handles detection
        run: npx jest --runInBand --ci --detectOpenHandles
        working-directory: socialPulse-app/backend

      - name: Verify TypeScript build
        run: npm run build
        working-directory: socialPulse-app/backend

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socialPulse-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm install --prefer-offline
        working-directory: socialPulse-app/frontend

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: socialPulse-app/frontend

      - name: Production build verification
        run: npm run build
        working-directory: socialPulse-app/frontend

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socialPulse-app/mobile/package-lock.json

      - name: Install dependencies
        run: npm install --prefer-offline
        working-directory: socialPulse-app/mobile

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: socialPulse-app/mobile
