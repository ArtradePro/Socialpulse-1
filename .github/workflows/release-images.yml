name: Release Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA to build and publish'
        required: true
        type: string
      release_id:
        description: 'Release identifier label (e.g. rel-20260901-01)'
        required: true
        type: string
      target_environment:
        description: 'Target deployment environment classification'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: release-images-${{ inputs.release_id || inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Immutable Release Images
    runs-on: ubuntu-latest

    steps:
      - name: Validate Commit SHA Format & Target Environment
        run: |
          # 1. Validate commit SHA format
          if ! [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA format. Must be exact 40-character hexadecimal."
            exit 1
          fi

          # 2. Validate environment allowlist
          if [ "${{ inputs.target_environment }}" != "staging" ] && [ "${{ inputs.target_environment }}" != "production" ]; then
            echo "ERROR: Target environment must strictly be 'staging' or 'production'."
            exit 1
          fi

      - name: Checkout Exact Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify Checked Out Commit
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Verified checkout SHA: $CURRENT_SHA"
          if [ "$CURRENT_SHA" != "${{ inputs.commit_sha }}" ]; then
            echo "ERROR: Checkout SHA mismatch!"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Immutable Image
        id: build_backend
        uses: docker/build-push-action@v5
        with:
          context: socialPulse-app/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/socialpulse-backend:sha-${{ inputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Immutable Image
        id: build_frontend
        uses: docker/build-push-action@v5
        with:
          context: socialPulse-app/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/socialpulse-frontend:sha-${{ inputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Release Manifest Artifact
        run: |
          mkdir -p artifacts
          cat <<EOF > artifacts/release-manifest.json
          {
            "schemaVersion": "1.0.0",
            "releaseId": "${{ inputs.release_id }}",
            "repository": "${{ github.repository }}",
            "sourceCommit": "${{ inputs.commit_sha }}",
            "targetEnvironment": "${{ inputs.target_environment }}",
            "backend": {
              "repository": "${{ secrets.DOCKERHUB_USERNAME }}/socialpulse-backend",
              "tag": "sha-${{ inputs.commit_sha }}",
              "digest": "${{ steps.build_backend.outputs.digest }}"
            },
            "frontend": {
              "repository": "${{ secrets.DOCKERHUB_USERNAME }}/socialpulse-frontend",
              "tag": "sha-${{ inputs.commit_sha }}",
              "digest": "${{ steps.build_frontend.outputs.digest }}"
            },
            "workflowRunId": "${{ github.run_id }}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          # Compute manifest checksum
          MANIFEST_CHECKSUM=$(sha256sum artifacts/release-manifest.json | awk '{print $1}')
          echo "Manifest SHA-256 Checksum: $MANIFEST_CHECKSUM"

          echo "=== RELEASE MANIFEST GENERATED ==="
          cat artifacts/release-manifest.json

      - name: Upload Release Manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ inputs.release_id }}
          path: artifacts/release-manifest.json
