name: Deploy Application

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment (strictly allowlisted)'
        required: true
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: 'Exact 40-character commit SHA verified and approved for release'
        required: true
        type: string
      release_id:
        description: 'Release identifier label (e.g. sp-8b-staging-release-01)'
        required: true
        type: string
      release_run_id:
        description: 'Workflow run ID of the release image publication run (e.g. 33556885396)'
        required: true
        type: string
      manifest_sha256:
        description: 'Exact SHA-256 checksum of the release manifest artifact (e.g. d1b64d19...)'
        required: true
        type: string
      backend_digest:
        description: 'Exact backend image digest (e.g. sha256:f2f9105c...)'
        required: true
        type: string
      frontend_digest:
        description: 'Exact frontend image digest (e.g. sha256:39bf3da1...)'
        required: true
        type: string
      authorization_reference:
        description: 'Executive written authorization identifier (e.g. AUTH-VERNON-20260901)'
        required: true
        type: string
      confirm_deployment:
        description: 'I confirm explicit authorization to deploy the specified immutable release'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Immutable Release (${{ inputs.environment }})
    # Explicitly target the dedicated staging runner; production cannot run on staging runner
    runs-on: [self-hosted, linux, socialpulse-staging]
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate Inputs, Allowlist & Fail-Closed Guards
        run: |
          echo "=== VALIDATING DEPLOYMENT INPUTS & AUTHORIZATION ==="

          # 1. Require explicit deployment confirmation
          if [ "${{ inputs.confirm_deployment }}" != "true" ]; then
            echo "ERROR: Deployment not confirmed. Aborting."
            exit 1
          fi

          # 2. Require non-empty authorization reference
          if [ -z "${{ inputs.authorization_reference }}" ]; then
            echo "ERROR: Authorization reference is strictly required."
            exit 1
          fi

          # 3. Environment allowlist enforcement (Fail-closed on production on staging runner)
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "ERROR: Production deployment is strictly prohibited on the staging runner. A separate production deployment channel is required."
            exit 1
          fi

          if [ "${{ inputs.environment }}" != "staging" ]; then
            echo "ERROR: Environment '${{ inputs.environment }}' is not permit-listed for this runner. Allowed: staging."
            exit 1
          fi

          # 4. Commit SHA format validation
          if ! [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA format."
            exit 1
          fi

          # 5. Digest format validation (sha256:<64-hex>)
          if ! [[ "${{ inputs.backend_digest }}" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || \
             ! [[ "${{ inputs.frontend_digest }}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Backend and frontend digests must strictly match OCI format (sha256:<64-hex>)."
            exit 1
          fi

          # 6. Checksum format validation (64-hex)
          if ! [[ "${{ inputs.manifest_sha256 }}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Manifest SHA-256 must be exactly 64 hexadecimal characters."
            exit 1
          fi

          echo "Validation passed for release '${{ inputs.release_id }}' on environment '${{ inputs.environment }}'."

      - name: Preflight Tool & Environment Availability Check
        run: |
          echo "=== PREFLIGHT TOOL AVAILABILITY CHECK ==="
          for tool in gh node sha256sum git docker wget; do
            if ! command -v "$tool" &>/dev/null; then
              echo "ERROR: Required tool '$tool' is not available on runner. Aborting."
              exit 1
            fi
          done
          if ! docker compose version &>/dev/null; then
            echo "ERROR: Docker Compose is not available on runner. Aborting."
            exit 1
          fi
          echo "All required deployment tools are available."

      - name: Authenticate Release Workflow Run & Artifact Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== AUTHENTICATING RELEASE RUN & ARTIFACT METADATA ==="

          # Query and verify workflow run metadata
          RUN_JSON=$(gh api "/repos/ArtradePro/Socialpulse-1/actions/runs/${{ inputs.release_run_id }}")
          node -e "
            const run = JSON.parse(process.argv[1]);
            if (run.repository.full_name !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Run repository mismatch:', run.repository.full_name);
              process.exit(1);
            }
            if (!run.path.endsWith('release-images.yml')) {
              console.error('ERROR: Run is not from release-images.yml:', run.path);
              process.exit(1);
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              console.error('ERROR: Release run did not complete successfully:', run.status, run.conclusion);
              process.exit(1);
            }
            if (run.event !== 'workflow_dispatch') {
              console.error('ERROR: Release run was not triggered via manual workflow_dispatch:', run.event);
              process.exit(1);
            }
            if (run.head_sha !== '${{ inputs.commit_sha }}') {
              console.error('ERROR: Release run head SHA mismatch:', run.head_sha);
              process.exit(1);
            }
            console.log('Release run metadata authenticated successfully.');
          " "$RUN_JSON"

          # Query and verify artifact metadata
          ARTIFACTS_JSON=$(gh api "/repos/ArtradePro/Socialpulse-1/actions/runs/${{ inputs.release_run_id }}/artifacts")
          node -e "
            const data = JSON.parse(process.argv[1]);
            const targetName = 'release-manifest-${{ inputs.release_id }}';
            const matched = (data.artifacts || []).filter(a => a.name === targetName);
            if (matched.length !== 1) {
              console.error('ERROR: Expected exactly 1 artifact named', targetName, 'found:', matched.length);
              process.exit(1);
            }
            if (matched[0].expired) {
              console.error('ERROR: Manifest artifact is expired.');
              process.exit(1);
            }
            console.log('Manifest artifact authenticated and unexpired.');
          " "$ARTIFACTS_JSON"

      - name: Checkout Authorized Release Configuration Provenance
        # Pinned immutably to official commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          clean: true

      - name: Verify Configuration & Git Provenance
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "${{ inputs.commit_sha }}" ]; then
            echo "ERROR: Checked out HEAD ($CURRENT_HEAD) does not match authorized commit (${{ inputs.commit_sha }})."
            exit 1
          fi
          echo "Configuration provenance verified at commit $CURRENT_HEAD."

      - name: Download & Cryptographically Verify Release Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== DOWNLOADING & VALIDATING RELEASE MANIFEST ==="
          MANIFEST_DIR="/tmp/manifest-${{ inputs.release_id }}"
          rm -rf "$MANIFEST_DIR"
          mkdir -p "$MANIFEST_DIR"

          # Download manifest artifact from the authorized release run
          gh run download "${{ inputs.release_run_id }}" --name "release-manifest-${{ inputs.release_id }}" --dir "$MANIFEST_DIR"

          MANIFEST_FILE="$MANIFEST_DIR/release-manifest.json"
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Release manifest file not found in artifact."
            exit 1
          fi

          # Compute SHA-256 and compare against authorized input
          COMPUTED_SHA256=$(sha256sum "$MANIFEST_FILE" | awk '{print $1}')
          echo "Computed Manifest SHA-256: $COMPUTED_SHA256"
          echo "Expected Manifest SHA-256: ${{ inputs.manifest_sha256 }}"

          if [ "$COMPUTED_SHA256" != "${{ inputs.manifest_sha256 }}" ]; then
            echo "ERROR: Manifest SHA-256 checksum mismatch! Aborting."
            exit 1
          fi

          # Safely parse and validate manifest contents
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('$MANIFEST_FILE', 'utf8'));

            if (m.repository !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Manifest repository mismatch:', m.repository);
              process.exit(1);
            }
            if (m.releaseId !== '${{ inputs.release_id }}') {
              console.error('ERROR: Manifest releaseId mismatch:', m.releaseId);
              process.exit(1);
            }
            if (m.environment !== '${{ inputs.environment }}') {
              console.error('ERROR: Manifest environment mismatch:', m.environment);
              process.exit(1);
            }
            if (m.sourceCommit !== '${{ inputs.commit_sha }}') {
              console.error('ERROR: Manifest sourceCommit mismatch:', m.sourceCommit);
              process.exit(1);
            }
            if (m.images.backend.digest !== '${{ inputs.backend_digest }}') {
              console.error('ERROR: Manifest backend digest mismatch:', m.images.backend.digest);
              process.exit(1);
            }
            if (m.images.frontend.digest !== '${{ inputs.frontend_digest }}') {
              console.error('ERROR: Manifest frontend digest mismatch:', m.images.frontend.digest);
              process.exit(1);
            }
            console.log('Manifest fields successfully verified against release authorization.');
          "

          echo "=== RELEASE MANIFEST CRYPTOGRAPHICALLY BOUND & VERIFIED ==="

      - name: Deploy to Local Target Host via Docker Compose
        run: |
          set -euo pipefail

          echo "=== INITIATING CONTROLLED LOCAL DEPLOYMENT ==="
          echo "Release ID: ${{ inputs.release_id }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Authorization: ${{ inputs.authorization_reference }}"
          echo "Commit SHA: ${{ inputs.commit_sha }}"

          # 1. Capture and strictly validate pre-deployment state for rollback
          echo "Capturing and validating pre-deployment container state..."
          PREV_BACKEND=$(docker inspect --format='{{.Config.Image}}' socialpulse-backend 2>/dev/null || true)
          PREV_FRONTEND=$(docker inspect --format='{{.Config.Image}}' socialpulse-frontend 2>/dev/null || true)

          if [ -z "$PREV_BACKEND" ] || [ -z "$PREV_FRONTEND" ]; then
            echo "ERROR: Previous container state is missing. A first deployment must be separately authorized."
            exit 1
          fi

          if ! [[ "$PREV_BACKEND" =~ @sha256:[0-9a-fA-F]{64}$ ]] && ! [[ "$PREV_BACKEND" =~ :sha-[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Previous backend image reference '$PREV_BACKEND' is not an immutable digest or immutable tag."
            exit 1
          fi

          if ! [[ "$PREV_FRONTEND" =~ @sha256:[0-9a-fA-F]{64}$ ]] && ! [[ "$PREV_FRONTEND" =~ :sha-[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Previous frontend image reference '$PREV_FRONTEND' is not an immutable digest or immutable tag."
            exit 1
          fi

          if ! docker image inspect "$PREV_BACKEND" &>/dev/null || ! docker image inspect "$PREV_FRONTEND" &>/dev/null; then
            echo "ERROR: Previous rollback images are not available in local Docker cache."
            exit 1
          fi

          echo "Rollback state verified. Prior backend: $PREV_BACKEND, Prior frontend: $PREV_FRONTEND."

          # Define fail-safe rollback handler for mutation boundary
          rollback() {
            trap - ERR
            echo "=== INITIATING FAIL-SAFE ROLLBACK ON MUTATION FAILURE ==="
            export SOCIALPULSE_BACKEND_IMAGE="$PREV_BACKEND"
            export SOCIALPULSE_FRONTEND_IMAGE="$PREV_FRONTEND"
            echo "Recreating services with prior verified images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build server client || true

            echo "Verifying rollback readiness..."
            ROLLBACK_READY=0
            for r_attempt in {1..6}; do
              if r_res=$(wget -qO- --timeout=5 http://localhost:5000/health/ready 2>/dev/null); then
                if echo "$r_res" | grep -q '"ready":true'; then
                  ROLLBACK_READY=1
                  break
                fi
              fi
              sleep 5
            done

            if [ "$ROLLBACK_READY" -eq 1 ]; then
              echo "Rollback successfully restored previous stable release."
            else
              echo "CRITICAL: Rollback attempted but /health/ready failed to report ready."
            fi
            echo "Release failed."
            exit 1
          }

          trap rollback ERR

          # === MUTATION BOUNDARY BEGINS ===
          BACKEND_REF="artradepro/socialpulse-backend@${{ inputs.backend_digest }}"
          FRONTEND_REF="artradepro/socialpulse-frontend@${{ inputs.frontend_digest }}"

          export SOCIALPULSE_BACKEND_IMAGE="$BACKEND_REF"
          export SOCIALPULSE_FRONTEND_IMAGE="$FRONTEND_REF"

          # 2. Pull verified immutable digests locally
          echo "Pulling verified digests..."
          docker pull "$BACKEND_REF"
          docker pull "$FRONTEND_REF"

          # 3. Rolling update of application services with explicit immutable digests
          echo "Restarting application containers..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build server client

          # 4. Bounded post-deployment readiness validation (polling /health/ready)
          echo "Running bounded post-deployment readiness validation..."
          READY=0
          for attempt in {1..6}; do
            echo "Readiness probe attempt $attempt of 6..."
            if response=$(wget -qO- --timeout=5 http://localhost:5000/health/ready 2>/dev/null); then
              if echo "$response" | grep -q '"ready":true'; then
                echo "Readiness probe passed: $response"
                READY=1
                break
              fi
            fi
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Application failed readiness validation on /health/ready after 30 seconds."
            rollback
          fi

          trap - ERR
          echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="

      - name: Persistent Runner Workspace & Manifest Cleanup
        if: always()
        run: |
          echo "=== RUNNING POST-DEPLOYMENT HYGIENE & CLEANUP ==="
          rm -rf "/tmp/manifest-${{ inputs.release_id }}" || true
          if [ -n "$GITHUB_WORKSPACE" ] && [ -d "$GITHUB_WORKSPACE" ] && [ "$GITHUB_WORKSPACE" != "/" ] && [ "$GITHUB_WORKSPACE" != "$HOME" ] && [ "$GITHUB_WORKSPACE" != "/opt" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi
          echo "Runner workspace and temporary files safely cleaned."

      - name: Output Deployment Audit Summary
        run: |
          echo "=== DEPLOYMENT AUDIT SUMMARY ==="
          echo "Environment: ${{ inputs.environment }}"
          echo "Release ID: ${{ inputs.release_id }}"
          echo "Authorization Ref: ${{ inputs.authorization_reference }}"
          echo "Commit SHA: ${{ inputs.commit_sha }}"
          echo "Backend Digest: ${{ inputs.backend_digest }}"
          echo "Frontend Digest: ${{ inputs.frontend_digest }}"
          echo "Manifest SHA-256: ${{ inputs.manifest_sha256 }}"
          echo "Deployed At: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Triggered By: ${{ github.actor }}"
