name: Deploy Application (Staging)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA verified and approved for release'
        required: true
        type: string
      release_id:
        description: 'Release identifier label (e.g. sp-8b-staging-release-01)'
        required: true
        type: string
      release_run_id:
        description: 'Workflow run ID of the release image publication run (e.g. 33556885396)'
        required: true
        type: string
      manifest_sha256:
        description: 'Exact SHA-256 checksum of the release manifest artifact (e.g. d1b64d19...)'
        required: true
        type: string
      authorization_reference:
        description: 'Executive written authorization identifier (e.g. AUTH-VERNON-20260901)'
        required: true
        type: string
      confirm_deployment:
        description: 'I confirm explicit authorization to deploy the specified immutable release to staging'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Immutable Release (staging)
    # Exclusively bound to the dedicated staging self-hosted runner and staging environment
    runs-on: [self-hosted, linux, socialpulse-staging]
    environment: staging

    steps:
      - name: Validate Inputs, Allowlist & Fail-Closed Guards
        env:
          INPUT_CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
          INPUT_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          echo "=== VALIDATING DEPLOYMENT INPUTS & AUTHORIZATION ==="

          # 1. Require explicit deployment confirmation
          if [ "$INPUT_CONFIRM_DEPLOYMENT" != "true" ]; then
            echo "ERROR: Deployment not confirmed. Aborting."
            exit 1
          fi

          # 2. Validate authorization reference format (bounded printable chars, no newlines/metacharacters)
          if ! [[ "$INPUT_AUTHORIZATION_REFERENCE" =~ ^[a-zA-Z0-9._\ -]{1,128}$ ]]; then
            echo "ERROR: Invalid authorization reference format. Must be 1-128 printable characters with no metacharacters."
            exit 1
          fi

          # 3. Validate release ID format (bounded alphanumeric, dot, underscore, dash, no leading dot)
          if ! [[ "$INPUT_RELEASE_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]; then
            echo "ERROR: Invalid release ID format."
            exit 1
          fi

          # 4. Validate commit SHA format (exact 40-character hexadecimal)
          if ! [[ "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA format. Must be exactly 40 hexadecimal characters."
            exit 1
          fi

          # 5. Validate release run ID format (digits only)
          if ! [[ "$INPUT_RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid release run ID format. Must contain digits only."
            exit 1
          fi

          # 6. Checksum format validation (exact 64-hexadecimal characters)
          if ! [[ "$INPUT_MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Manifest SHA-256 must be exactly 64 hexadecimal characters."
            exit 1
          fi

          echo "Validation passed for release '$INPUT_RELEASE_ID' targeting staging."

      - name: Preflight Tool & Environment Availability Check
        run: |
          set -euo pipefail
          echo "=== PREFLIGHT TOOL AVAILABILITY CHECK ==="
          for tool in gh node sha256sum git docker wget realpath mktemp; do
            if ! command -v "$tool" &>/dev/null; then
              echo "ERROR: Required tool '$tool' is not available on runner. Aborting."
              exit 1
            fi
          done
          if ! docker compose version &>/dev/null; then
            echo "ERROR: Docker Compose is not available on runner. Aborting."
            exit 1
          fi
          echo "All required deployment tools are available."

      - name: Authenticate Release Workflow Run & Artifact Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          echo "=== AUTHENTICATING RELEASE RUN & ARTIFACT METADATA ==="

          # Query and verify workflow run metadata
          RUN_JSON=$(gh api "/repos/ArtradePro/Socialpulse-1/actions/runs/$INPUT_RELEASE_RUN_ID")
          node -e "
            const run = JSON.parse(process.argv[1]);
            if (run.repository.full_name !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Run repository mismatch:', run.repository.full_name);
              process.exit(1);
            }
            if (run.path !== '.github/workflows/release-images.yml') {
              console.error('ERROR: Run is not exact .github/workflows/release-images.yml:', run.path);
              process.exit(1);
            }
            if (run.name !== 'Release Images') {
              console.error('ERROR: Run name mismatch:', run.name);
              process.exit(1);
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              console.error('ERROR: Release run did not complete successfully:', run.status, run.conclusion);
              process.exit(1);
            }
            if (run.event !== 'workflow_dispatch') {
              console.error('ERROR: Release run was not triggered via manual workflow_dispatch:', run.event);
              process.exit(1);
            }
            if (run.head_sha !== process.env.INPUT_COMMIT_SHA) {
              console.error('ERROR: Release run head SHA mismatch:', run.head_sha);
              process.exit(1);
            }
            console.log('Release run metadata authenticated successfully.');
          " "$RUN_JSON"

          # Query and verify artifact metadata
          ARTIFACTS_JSON=$(gh api "/repos/ArtradePro/Socialpulse-1/actions/runs/$INPUT_RELEASE_RUN_ID/artifacts")
          node -e "
            const data = JSON.parse(process.argv[1]);
            const targetName = 'release-manifest-' + process.env.INPUT_RELEASE_ID;
            const matched = (data.artifacts || []).filter(a => a.name === targetName);
            if (matched.length !== 1) {
              console.error('ERROR: Expected exactly 1 artifact named', targetName, 'found:', matched.length);
              process.exit(1);
            }
            if (matched[0].expired) {
              console.error('ERROR: Manifest artifact is expired.');
              process.exit(1);
            }
            console.log('Manifest artifact authenticated and unexpired.');
          " "$ARTIFACTS_JSON"

      - name: Checkout Authorized Release Configuration Provenance
        # Pinned immutably to official commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          clean: true

      - name: Verify Configuration & Git Provenance
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "$INPUT_COMMIT_SHA" ]; then
            echo "ERROR: Checked out HEAD ($CURRENT_HEAD) does not match authorized commit ($INPUT_COMMIT_SHA)."
            exit 1
          fi
          echo "Configuration provenance verified at commit $CURRENT_HEAD."

      - name: Create Secure Temporary Directory & Cryptographically Verify Release Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          echo "=== CREATING SECURE TEMPORARY DIRECTORY & DOWNLOADING RELEASE MANIFEST ==="

          # Use canonical RUNNER_TEMP
          TEMP_ROOT="${RUNNER_TEMP:-/tmp}"
          CANONICAL_ROOT=$(realpath "$TEMP_ROOT")

          SECURE_DIR=$(mktemp -d "$CANONICAL_ROOT/sp-manifest.XXXXXX")
          CANONICAL_SECURE_DIR=$(realpath "$SECURE_DIR")

          # Path safety validation: ensure directory is strictly inside CANONICAL_ROOT and not a symlink
          if [[ "$CANONICAL_SECURE_DIR" != "$CANONICAL_ROOT/"* ]] || [ -L "$SECURE_DIR" ]; then
            echo "ERROR: Unsafe temporary directory path: $SECURE_DIR"
            exit 1
          fi

          echo "MANIFEST_TMP_DIR=$CANONICAL_SECURE_DIR" >> "$GITHUB_ENV"

          # Download manifest artifact from the authorized release run into secure temp dir
          gh run download "$INPUT_RELEASE_RUN_ID" --name "release-manifest-$INPUT_RELEASE_ID" --dir "$CANONICAL_SECURE_DIR"

          MANIFEST_FILE="$CANONICAL_SECURE_DIR/release-manifest.json"
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Release manifest file not found in artifact."
            exit 1
          fi

          # Compute SHA-256 and compare against authorized input
          COMPUTED_SHA256=$(sha256sum "$MANIFEST_FILE" | awk '{print $1}')
          echo "Computed Manifest SHA-256: $COMPUTED_SHA256"
          echo "Expected Manifest SHA-256: $INPUT_MANIFEST_SHA256"

          if [ "$COMPUTED_SHA256" != "$INPUT_MANIFEST_SHA256" ]; then
            echo "ERROR: Manifest SHA-256 checksum mismatch! Aborting."
            exit 1
          fi

          # Safely parse and validate actual SP-8B manifest schema, exporting verified digests to GITHUB_ENV
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));

            if (m.schemaVersion !== '1.0.0') {
              console.error('ERROR: Invalid manifest schemaVersion:', m.schemaVersion);
              process.exit(1);
            }
            if (m.repository !== 'ArtradePro/Socialpulse-1') {
              console.error('ERROR: Manifest repository mismatch:', m.repository);
              process.exit(1);
            }
            if (m.releaseId !== process.env.INPUT_RELEASE_ID) {
              console.error('ERROR: Manifest releaseId mismatch:', m.releaseId);
              process.exit(1);
            }
            if (m.targetEnvironment !== 'staging') {
              console.error('ERROR: Manifest targetEnvironment mismatch (expected staging):', m.targetEnvironment);
              process.exit(1);
            }
            if (m.sourceCommit !== process.env.INPUT_COMMIT_SHA) {
              console.error('ERROR: Manifest sourceCommit mismatch:', m.sourceCommit);
              process.exit(1);
            }
            if (String(m.workflowRunId) !== process.env.INPUT_RELEASE_RUN_ID) {
              console.error('ERROR: Manifest workflowRunId mismatch:', m.workflowRunId);
              process.exit(1);
            }
            if (!m.backend || m.backend.repository !== 'artradepro/socialpulse-backend' || !/^sha256:[0-9a-fA-F]{64}$/.test(m.backend.digest)) {
              console.error('ERROR: Invalid manifest backend structure or digest:', m.backend);
              process.exit(1);
            }
            if (!m.frontend || m.frontend.repository !== 'artradepro/socialpulse-frontend' || !/^sha256:[0-9a-fA-F]{64}$/.test(m.frontend.digest)) {
              console.error('ERROR: Invalid manifest frontend structure or digest:', m.frontend);
              process.exit(1);
            }

            const backendRef = m.backend.repository + '@' + m.backend.digest;
            const frontendRef = m.frontend.repository + '@' + m.frontend.digest;

            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_BACKEND_REF=' + backendRef + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_FRONTEND_REF=' + frontendRef + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_BACKEND_DIGEST=' + m.backend.digest + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPLOY_FRONTEND_DIGEST=' + m.frontend.digest + '\n');
            console.log('Manifest successfully authenticated against SP-8B schema. Image refs derived directly from manifest.');
          " "$MANIFEST_FILE"

          echo "=== RELEASE MANIFEST CRYPTOGRAPHICALLY BOUND & VERIFIED ==="

      - name: Deploy to Local Staging Host via Docker Compose with Fail-Safe Rollback
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          TARGET_BACKEND_REF: ${{ env.DEPLOY_BACKEND_REF }}
          TARGET_FRONTEND_REF: ${{ env.DEPLOY_FRONTEND_REF }}
        run: |
          set -euo pipefail
          set -E

          echo "=== INITIATING CONTROLLED LOCAL STAGING DEPLOYMENT ==="
          echo "Release ID: $INPUT_RELEASE_ID"
          echo "Authorization: $INPUT_AUTHORIZATION_REFERENCE"
          echo "Commit SHA: $INPUT_COMMIT_SHA"

          # 1. Capture and strictly validate pre-deployment state for rollback
          echo "Capturing and validating pre-deployment container state..."
          PREV_BACKEND=$(docker inspect --format='{{.Config.Image}}' socialpulse-backend 2>/dev/null || true)
          PREV_FRONTEND=$(docker inspect --format='{{.Config.Image}}' socialpulse-frontend 2>/dev/null || true)

          if [ -z "$PREV_BACKEND" ] || [ -z "$PREV_FRONTEND" ]; then
            echo "ERROR: Previous container state is missing. A first/bootstrap deployment must be separately governed."
            exit 1
          fi

          # Require digest-only pinned references matching the exact repository
          if ! [[ "$PREV_BACKEND" =~ ^artradepro/socialpulse-backend@sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Previous backend image reference '$PREV_BACKEND' is not an immutable digest reference (expected artradepro/socialpulse-backend@sha256:<64-hex>)."
            exit 1
          fi

          if ! [[ "$PREV_FRONTEND" =~ ^artradepro/socialpulse-frontend@sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Previous frontend image reference '$PREV_FRONTEND' is not an immutable digest reference (expected artradepro/socialpulse-frontend@sha256:<64-hex>)."
            exit 1
          fi

          # Verify rollback images exist locally
          if ! docker image inspect "$PREV_BACKEND" &>/dev/null || ! docker image inspect "$PREV_FRONTEND" &>/dev/null; then
            echo "ERROR: Previous rollback images are not available in local Docker cache."
            exit 1
          fi

          echo "Rollback state verified. Prior backend: $PREV_BACKEND, Prior frontend: $PREV_FRONTEND."

          # Define fail-safe rollback handler for mutation boundary
          rollback() {
            trap '' ERR INT TERM
            set +e
            echo "=== INITIATING FAIL-SAFE ROLLBACK ON MUTATION FAILURE ==="
            export SOCIALPULSE_BACKEND_IMAGE="$PREV_BACKEND"
            export SOCIALPULSE_FRONTEND_IMAGE="$PREV_FRONTEND"

            echo "Recreating services with prior verified immutable images..."
            COMPOSE_EXIT=0
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build server client || COMPOSE_EXIT=$?

            echo "Verifying rollback readiness on /health/ready..."
            ROLLBACK_READY=0
            for r_attempt in {1..6}; do
              RESPONSE=$(wget -qO- --timeout=5 http://localhost:5000/health/ready 2>/dev/null || true)
              if [ -n "$RESPONSE" ]; then
                if node -e "
                  try {
                    const data = JSON.parse(process.argv[1]);
                    if (data.ready === true) process.exit(0);
                  } catch(e) {}
                  process.exit(1);
                " "$RESPONSE" 2>/dev/null; then
                  ROLLBACK_READY=1
                  break
                fi
              fi
              sleep 5
            done

            if [ "$COMPOSE_EXIT" -eq 0 ] && [ "$ROLLBACK_READY" -eq 1 ]; then
              echo "Rollback successfully restored previous stable release."
            else
              echo "CRITICAL: Rollback failed! Compose exit: $COMPOSE_EXIT, Readiness: $ROLLBACK_READY. Manual host inspection required."
            fi
            echo "Deployment release failed. Exiting with failure status."
            exit 1
          }

          trap rollback ERR INT TERM

          # === MUTATION BOUNDARY BEGINS ===
          export SOCIALPULSE_BACKEND_IMAGE="$TARGET_BACKEND_REF"
          export SOCIALPULSE_FRONTEND_IMAGE="$TARGET_FRONTEND_REF"

          # 2. Pull verified immutable digests locally
          echo "Pulling verified immutable digests derived from manifest..."
          docker pull "$TARGET_BACKEND_REF"
          docker pull "$TARGET_FRONTEND_REF"

          # 3. Rolling update of application services with explicit immutable digests
          echo "Restarting application containers with verified release..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build server client

          # 4. Bounded post-deployment readiness validation with JSON response verification
          echo "Running bounded post-deployment readiness validation on /health/ready..."
          READY=0
          for attempt in {1..6}; do
            echo "Readiness probe attempt $attempt of 6..."
            RESPONSE=$(wget -qO- --timeout=5 http://localhost:5000/health/ready 2>/dev/null || true)
            if [ -n "$RESPONSE" ]; then
              if node -e "
                try {
                  const data = JSON.parse(process.argv[1]);
                  if (data.ready === true) process.exit(0);
                } catch(e) {}
                process.exit(1);
              " "$RESPONSE" 2>/dev/null; then
                echo "Readiness probe passed (ready: true)."
                READY=1
                break
              fi
            fi
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Application failed readiness validation on /health/ready after 30 seconds."
            rollback
          fi

          trap - ERR INT TERM
          echo "=== STAGING DEPLOYMENT COMPLETED SUCCESSFULLY ==="

      - name: Secure Temporary Artifact Cleanup
        if: always()
        run: |
          echo "=== RUNNING POST-DEPLOYMENT SECURE CLEANUP ==="
          if [ -n "${MANIFEST_TMP_DIR:-}" ] && [ -d "$MANIFEST_TMP_DIR" ]; then
            CANONICAL_TEMP_DIR=$(realpath "$MANIFEST_TMP_DIR" 2>/dev/null || true)
            TEMP_ROOT="${RUNNER_TEMP:-/tmp}"
            CANONICAL_ROOT=$(realpath "$TEMP_ROOT" 2>/dev/null || true)
            if [[ "$CANONICAL_TEMP_DIR" == "$CANONICAL_ROOT/"* ]] && [ "$CANONICAL_TEMP_DIR" != "/" ] && [ "$CANONICAL_TEMP_DIR" != "$HOME" ] && [ "$CANONICAL_TEMP_DIR" != "/opt" ]; then
              rm -rf "$CANONICAL_TEMP_DIR"
              echo "Generated temporary manifest directory safely cleaned: $CANONICAL_TEMP_DIR"
            fi
          fi

      - name: Output Deployment Audit Summary
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DEPLOY_BACKEND_DIGEST: ${{ env.DEPLOY_BACKEND_DIGEST }}
          DEPLOY_FRONTEND_DIGEST: ${{ env.DEPLOY_FRONTEND_DIGEST }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          echo "=== DEPLOYMENT AUDIT SUMMARY ==="
          echo "Environment: staging"
          echo "Release ID: $INPUT_RELEASE_ID"
          echo "Authorization Ref: $INPUT_AUTHORIZATION_REFERENCE"
          echo "Commit SHA: $INPUT_COMMIT_SHA"
          echo "Backend Digest: $DEPLOY_BACKEND_DIGEST"
          echo "Frontend Digest: $DEPLOY_FRONTEND_DIGEST"
          echo "Manifest SHA-256: $INPUT_MANIFEST_SHA256"
          echo "Deployed At: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Triggered By: ${{ github.actor }}"
