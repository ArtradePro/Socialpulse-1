# Staging infrastructure Compose file — contains ONLY PostgreSQL and Redis
# Used by bootstrap-infra.yml and as the base for migration operations.
# Operates without requiring any backend or frontend application image variables.
# Ports are unexposed (internal container network only).
# Minimum required Docker Compose version: v2.24.4+

name: socialpulse-staging

services:

  postgres:
    image: postgres@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: socialpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
