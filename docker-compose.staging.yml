# Staging overlay — use alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env up -d
#
# Isolation Guarantees:
#   1. PostgreSQL and Redis host ports are unexposed (ports: [])
#   2. Application ports are bound strictly to loopback (127.0.0.1)
#   3. Infrastructure images are pinned to immutable official OCI digests
#   4. Persistent data is preserved across deployments in named volumes (postgres_data, redis_data)

version: "3.8"

services:

  postgres:
    image: ${SOCIALPULSE_POSTGRES_IMAGE:-postgres@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b}
    restart: unless-stopped
    ports: []                     # remove host exposure — internal container network only
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${SOCIALPULSE_REDIS_IMAGE:-redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    restart: unless-stopped
    ports: []                     # remove host exposure — internal container network only
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${SOCIALPULSE_BACKEND_IMAGE:?SOCIALPULSE_BACKEND_IMAGE environment variable is strictly required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"      # loopback only — not exposed on public interfaces
    volumes: []                   # no source mounts in staging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/socialpulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY}
      STRIPE_PRICE_ENT_MONTHLY: ${STRIPE_PRICE_ENT_MONTHLY}
      STRIPE_PRICE_ENT_YEARLY: ${STRIPE_PRICE_ENT_YEARLY}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      INSTAGRAM_CALLBACK_URL: ${INSTAGRAM_CALLBACK_URL}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      APP_URL: ${APP_URL}
      CLIENT_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ACTIVE_ENCRYPTION_KEY_ID: ${ACTIVE_ENCRYPTION_KEY_ID}
      ENCRYPTION_KEYS_JSON: ${ENCRYPTION_KEYS_JSON}
      EVERGREEN_INTEGRATION_SECRET: ${EVERGREEN_INTEGRATION_SECRET}
      Q2C_WEBHOOK_SECRET: ${Q2C_WEBHOOK_SECRET}
      Q2C_API_URL: ${Q2C_API_URL}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    image: ${SOCIALPULSE_FRONTEND_IMAGE:?SOCIALPULSE_FRONTEND_IMAGE environment variable is strictly required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"      # loopback only — not exposed on public interfaces
    volumes: []

  # One-shot migration runner — executed via authorized migration workflow:
  #   docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file /opt/socialpulse/.env run --rm migrate
  migrate:
    image: ${SOCIALPULSE_BACKEND_IMAGE:?SOCIALPULSE_BACKEND_IMAGE environment variable is strictly required}
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/socialpulse
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
