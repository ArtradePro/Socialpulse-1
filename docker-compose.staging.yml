# ==============================================================================
# SOCIALPULSE PHASE SP-8C-6R: DEDICATED STAGING COMPOSE SPECIFICATION
# Architecture: Hardened Self-Contained Staging Environment
# Project Name: socialpulse-staging
# Execution: Rootless Docker Daemon (unix:///run/user/1001/docker.sock)
# Daemon User: github-runner (Unprivileged UID 1001)
# Security Profile: Containers running under an unprivileged rootless daemon (UID 1001).
#                   No privileged containers, no host namespaces (PID/IPC/NET),
#                   no device passthrough, no Docker socket mounts (/var/run/docker.sock denied).
# Ports: Loopback ONLY — Backend: 127.0.0.1:3001 -> 3000/tcp, Frontend: 127.0.0.1:8081 -> 3000/tcp.
# Isolation: Zero access to /var/run/docker.sock or Evergreen assets (Port 3000 protected).
# Migrations: Automatic migrations prohibited (profiles: ["migration"]).
# ==============================================================================
name: socialpulse-staging

services:

  postgres:
    image: postgres@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: socialpulse-staging-postgres-1
    restart: unless-stopped
    privileged: false
    security_opt:
      - no-new-privileges:true
    ports: [] # Unexposed to host — internal container network only
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: socialpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: socialpulse-staging-redis-1
    restart: unless-stopped
    privileged: false
    security_opt:
      - no-new-privileges:true
    ports: [] # Unexposed to host — internal container network only
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${SOCIALPULSE_BACKEND_IMAGE:?SOCIALPULSE_BACKEND_IMAGE is strictly required}
    container_name: socialpulse-staging-server-1
    restart: unless-stopped
    privileged: false
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3001:3000" # Loopback ONLY — host port 3001 mapped to container port 3000
    environment:
      NODE_ENV: production
      PORT: "3000" # Honors container port 3000 contract
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/socialpulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ACTIVE_ENCRYPTION_KEY_ID: ${ACTIVE_ENCRYPTION_KEY_ID}
      ENCRYPTION_KEYS_JSON: ${ENCRYPTION_KEYS_JSON}
      EVERGREEN_INTEGRATION_SECRET: ${EVERGREEN_INTEGRATION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      APP_URL: ${APP_URL}
      CLIENT_URL: ${CLIENT_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/live', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    image: ${SOCIALPULSE_FRONTEND_IMAGE:?SOCIALPULSE_FRONTEND_IMAGE is strictly required}
    container_name: socialpulse-staging-client-1
    restart: unless-stopped
    privileged: false
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8081:3000" # Loopback ONLY — host port 8081 mapped to container port 3000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - staging_net

  # Dedicated migration runner — assigned to 'migration' profile so it NEVER runs during normal compose up
  migrate:
    image: ${SOCIALPULSE_BACKEND_IMAGE:?SOCIALPULSE_BACKEND_IMAGE is strictly required}
    container_name: socialpulse-staging-migrate-1
    profiles:
      - migration
    restart: "no"
    privileged: false
    security_opt:
      - no-new-privileges:true
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/socialpulse
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging_net

networks:
  staging_net:
    name: socialpulse-staging_net
    driver: bridge

volumes:
  postgres_data:
    name: socialpulse-staging_postgres_data
  redis_data:
    name: socialpulse-staging_redis_data
