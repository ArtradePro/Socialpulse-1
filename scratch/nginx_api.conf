server {
    server_name api.usesocialpulse.com;

    # Allow large requests (images, videos, metadata)
    client_max_body_size 50M;

    # SUPER FORCEFUL ACME BLOCK
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type "text/plain";
        autoindex on;
    }

    # Proxy to your Node.js backend with correct IP forwarding
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSL (Let's Encrypt via Certbot) ---
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.usesocialpulse.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.usesocialpulse.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.usesocialpulse.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.usesocialpulse.com;
    return 404; # managed by Certbot
}
